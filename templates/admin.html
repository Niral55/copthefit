<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Cop the Fit Admin</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
@font-face { font-family: "Big Shoulders Display"; font-weight: 800; font-display: swap; src: url(fonts/big-shoulders-display-latin-800-normal.woff2) format("woff2"); }
@font-face { font-family: "Big Shoulders Display"; font-weight: 900; font-display: swap; src: url(fonts/big-shoulders-display-latin-900-normal.woff2) format("woff2"); }
@font-face { font-family: "Instrument Sans"; font-weight: 400; font-display: swap; src: url(fonts/instrument-sans-latin-400-normal.woff2) format("woff2"); }
@font-face { font-family: "Instrument Sans"; font-weight: 600; font-display: swap; src: url(fonts/instrument-sans-latin-600-normal.woff2) format("woff2"); }
@font-face { font-family: "IBM Plex Mono"; font-weight: 400; font-display: swap; src: url(fonts/ibm-plex-mono-latin-400-normal.woff2) format("woff2"); }
@font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: swap; src: url(fonts/ibm-plex-mono-latin-500-normal.woff2) format("woff2"); }
/* Admin: list of posts by stage on the left/top, one editor at a time. Same tokens as the public site. */
:root {
  --paper: #ECEEF1; --tag: #FFFFFF; --ink: #13151A; --muted: #5B626E; --line: #D3D8DF;
  --accent: #2238C9; --accent-ink: #FFFFFF; --similar: #E3E7FF; --ok: #1E7A3C; --warn: #A15C00; --bad: #B4321F;
  --display: "Big Shoulders Display", "Arial Narrow", sans-serif;
  --body: "Instrument Sans", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root { --paper: #0E1014; --tag: #171A20; --ink: #E8EBF0; --muted: #98A0AC; --line: #2A2F38;
          --accent: #8C9EFF; --accent-ink: #0E1014; --similar: #222842; --ok: #5BC27E; --warn: #E0A040; --bad: #FF8A6B; color-scheme: dark; }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 14px/1.45 var(--body); }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1100px; margin: 0 auto; padding-inline: 16px; padding-block: 0 60px; }
header { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; padding-block: 20px 12px; border-bottom: 2px solid var(--ink); }
.mark { font: 900 40px/.9 var(--display); text-transform: uppercase; text-decoration: none; color: var(--ink); }
.mark span { color: var(--accent); }
.mark small { font: 500 12px var(--mono); letter-spacing: .1em; color: var(--muted); margin-left: 8px; vertical-align: 6px; }
.btn { font: 600 13px var(--body); padding: 9px 13px; border-radius: 5px; border: 1px solid var(--line); background: var(--tag); color: var(--ink); cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.dark { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.btn.danger { color: var(--bad); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.sm { padding: 6px 9px; font-size: 12px; }
.bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding-block: 14px; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tab { font: 500 12px var(--mono); letter-spacing: .05em; text-transform: uppercase; padding: 8px 12px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--ink); cursor: pointer; }
.tab[aria-selected="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.tab b { font-weight: 500; opacity: .7; margin-left: 4px; }
.grow { flex: 1 1 200px; min-width: 0; }
input, select, textarea { font: 14px var(--body); color: var(--ink); background: var(--tag); border: 1px solid var(--line); border-radius: 5px; padding: 9px 10px; width: 100%; min-width: 0; }
textarea { min-height: 72px; resize: vertical; }
input[type="checkbox"] { width: auto; }
label.f { display: flex; flex-direction: column; gap: 4px; font: 500 11px var(--mono); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); min-width: 0; }
.hint { font-size: 12.5px; color: var(--muted); margin: 0; }
#flash { position: fixed; top: 14px; right: 14px; z-index: 60; width: min(440px, calc(100vw - 28px)); display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
#flash .msg { margin: 0; pointer-events: auto; box-shadow: 0 8px 28px rgba(0,0,0,.18); display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; background: var(--tag); }
#flash .msg .x { border: 0; background: none; color: inherit; cursor: pointer; font-size: 16px; line-height: 1; padding: 0 2px; }
#flash .msg .undo { border: 1px solid currentColor; background: none; color: inherit; border-radius: 4px; font: 600 12px var(--body); padding: 3px 8px; cursor: pointer; white-space: nowrap; }
.msg { font-size: 13px; padding: 9px 12px; border-radius: 5px; background: var(--tag); border: 1px solid var(--line); margin: 10px 0; }
.msg.ok { border-color: var(--ok); color: var(--ok); }
.msg.err { border-color: var(--bad); color: var(--bad); }

/* list */
.list { display: flex; flex-direction: column; gap: 8px; }
.status { display: flex; flex-wrap: wrap; gap: 6px; margin: 2px 0 8px; }
.status .st { font: 12.5px var(--body); padding: 6px 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--tag); color: var(--ink); text-decoration: none; display: inline-flex; gap: 6px; align-items: center; }
.status .st::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex: none; }
.status .st.warn::before { background: var(--warn); }
.status .st.bad::before { background: var(--bad); }
.status a.st:hover { border-color: var(--ink); }
.prods { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.prod { display: flex; flex-direction: column; gap: 8px; background: var(--tag); border: 1px solid var(--line); border-radius: 6px; padding: 12px; min-width: 0; }
.prod.busy { opacity: .45; pointer-events: none; transition: opacity .15s; }
.prod .pic.none { aspect-ratio: auto; height: 120px; background: var(--paper); border: 1px dashed var(--line); }
.prod .pic { aspect-ratio: 1; max-height: 220px; background: #fff; border-radius: 4px; display: grid; place-items: center; overflow: hidden; }
.prod .pic img { width: 100%; height: 100%; object-fit: contain; }
.prod .meta { font: 11px var(--mono); color: var(--muted); overflow-wrap: anywhere; }
.prod .raw { font-size: 12px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.prod .sug { font-size: 12.5px; border-left: 3px solid var(--accent); padding-left: 8px; }
#openProducts b { font: 500 11px var(--mono); margin-left: 4px; }
.cfg { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; align-items: start; }
.cfg .panel { display: flex; flex-direction: column; gap: 10px; }
.stores { display: flex; flex-direction: column; gap: 8px; }
.store { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: end; padding-bottom: 8px; border-bottom: 1px dashed var(--line); }
.store label:nth-of-type(2) { grid-column: 1 / -1; grid-row: 2; }
.aff { font: 12px var(--body); text-transform: none; letter-spacing: 0; color: var(--warn); overflow-wrap: anywhere; }
.aff.on { color: var(--ok, #3fb950); }
.out { font: 12px var(--mono); overflow-wrap: anywhere; background: var(--paper); border: 1px solid var(--line); border-radius: 4px; padding: 8px; min-height: 34px; }
.rowwrap { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: stretch; background: var(--tag); border: 1px solid var(--line); border-radius: 6px; }
.rowwrap:hover { border-color: var(--ink); }
.rowwrap .row { border: 0; background: transparent; border-radius: 0 6px 6px 0; }
.pick { display: grid; place-items: center; width: 44px; cursor: pointer; border-right: 1px solid var(--line); }
.pick input, .bulk input { width: 18px; height: 18px; accent-color: var(--accent); cursor: pointer; }
.rowwrap.sel { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
.bulk { position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; padding: 10px 0; background: var(--paper); }
.bulk label { display: flex; align-items: center; gap: 8px; font: 500 13px var(--mono); text-transform: uppercase; letter-spacing: .04em; cursor: pointer; }
.bulk .n { font: 500 13px var(--mono); color: var(--muted); margin-right: 4px; }
.row { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 14px; align-items: center; background: var(--tag); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; cursor: pointer; text-align: left; color: inherit; font: inherit; width: 100%; }
.row:hover { border-color: var(--ink); }
.thumb { width: 64px; aspect-ratio: 4 / 5; border-radius: 4px; overflow: hidden; background: var(--paper); display: grid; place-items: center; font: 9px var(--mono); color: var(--muted); text-transform: uppercase; text-align: center; }
.thumb img { width: 100%; height: 100%; object-fit: cover; object-position: center 20%; display: block; }
.row .num { font: 500 11px var(--mono); color: var(--muted); }
.row .who { font: 800 22px/1 var(--display); text-transform: uppercase; }
.row .hl { font-size: 13.5px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
.chip { font: 500 10.5px var(--mono); letter-spacing: .04em; text-transform: uppercase; padding: 3px 7px; border-radius: 3px; border: 1px solid var(--line); color: var(--muted); }
.chip.ok { border-color: var(--ok); color: var(--ok); }
.chip.no { border-color: var(--warn); color: var(--warn); }
.chip.score { color: var(--ink); }
.chip.score.mid { border-color: var(--warn); color: var(--warn); }
.chip.score.hi { background: var(--ok); border-color: var(--ok); color: var(--paper); }
.chip.next { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.empty { padding: 30px 0; color: var(--muted); }

/* editor */
.ed-head { display: flex; flex-wrap: wrap; gap: 10px; align-items: baseline; justify-content: space-between; padding-block: 16px 8px; }
.ed-title { font: 800 34px/1 var(--display); text-transform: uppercase; margin: 0; }
.pill { font: 500 11px var(--mono); letter-spacing: .06em; text-transform: uppercase; padding: 4px 9px; border-radius: 999px; background: var(--ink); color: var(--paper); }
.ed { display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: 22px; align-items: start; }
.panel { background: var(--tag); border: 1px solid var(--line); border-radius: 8px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.panel h2 { margin: 0; font: 500 11px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.photo { position: relative; min-height: 220px; background: var(--paper); border-radius: 6px; overflow: hidden; display: grid; place-items: center; }
.photo .pw { position: relative; line-height: 0; cursor: crosshair; max-width: 100%; }
.photo img { max-width: 100%; max-height: 520px; width: auto; height: auto; display: block; }
.photo .ph { font: 500 11px var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .08em; text-align: center; padding: 16px; line-height: 1.5;
  position: absolute; inset: 0; display: grid; place-items: center; background: repeating-linear-gradient(-45deg, var(--paper) 0 8px, var(--tag) 8px 16px); }
.mk { position: absolute; width: 26px; height: 26px; margin: -13px 0 0 -13px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); border: 2px solid #fff; font: 700 13px/22px var(--body); text-align: center; pointer-events: none; }
.srch { font-size: 13px; }
.igrp { display: contents; }
.leads { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
.leads .kind { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; border: 1px solid var(--line); border-radius: 3px; padding: 1px 5px; }
.cands { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.cands button { padding: 0; border: 1px solid var(--line); border-radius: 4px; background: var(--paper); cursor: pointer; aspect-ratio: 4 / 5; overflow: hidden; }
.cands img { width: 100%; height: 100%; object-fit: cover; display: block; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.three { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
.items { display: flex; flex-direction: column; gap: 10px; }
.it { display: grid; grid-template-columns: 28px 76px minmax(0, 1fr) auto; gap: 10px; align-items: start; border: 1px solid var(--line); border-radius: 6px; padding: 10px; }
.it .n { width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font: 700 12px var(--body); }
.it .img { width: 76px; aspect-ratio: 1; border-radius: 4px; border: 1px dashed var(--line); background: var(--paper); display: grid; place-items: center; overflow: hidden; cursor: pointer; font: 9px var(--mono); color: var(--muted); text-transform: uppercase; text-align: center; padding: 0; }
.it .img img { width: 100%; height: 100%; object-fit: contain; background: #fff; }
.it .fields { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: 8px; min-width: 0; }
.it .fields .wide { grid-column: 1 / -1; }
.it .ctl { display: flex; flex-direction: column; gap: 4px; }
.ready { display: flex; flex-direction: column; gap: 4px; margin: 0; padding: 0; list-style: none; font-size: 13px; }
.ready li::before { content: "○ "; color: var(--warn); }
.ready li.done::before { content: "● "; color: var(--ok); }
.actions { position: sticky; bottom: 0; display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 0 calc(12px + env(safe-area-inset-bottom, 0px)); background: var(--paper); border-top: 1px solid var(--line); margin-top: 18px; }
dialog { border: 1px solid var(--line); border-radius: 8px; background: var(--tag); color: var(--ink); max-width: 440px; width: calc(100% - 32px); }
dialog::backdrop { background: rgba(0,0,0,.35); }
@media (max-width: 760px) {
  .tabs { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; width: 100%; padding-bottom: 2px; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { white-space: nowrap; }
  header .btn { padding: 7px 10px; font-size: 13px; }
  .pick { width: 38px; }
  .ed { grid-template-columns: minmax(0, 1fr); }
  .it { grid-template-columns: 28px 64px minmax(0, 1fr); }
  .it .img { width: 64px; }
  .it .ctl { grid-column: 3; flex-direction: row; }
  .it .fields { grid-template-columns: 1fr; }
  .three { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="mark" href="./">Cop the <span>Fit</span><small>ADMIN</small></a>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="openProducts" type="button">Products <b id="prodCount"></b></button><button class="btn" id="openCfg" type="button">Affiliates &amp; settings</button><button class="btn" id="openSettings" type="button">GitHub</button><a class="btn" href="./" target="_blank">View site ↗</a></div>
  </header>
  <div id="flash"></div>

  <section id="listView">
    <div class="bar">
      <div class="tabs" role="tablist" id="tabs"></div>
      <input class="grow" id="q" type="search" placeholder="Search name, headline or Find #" aria-label="Search posts">
      <button class="btn" id="bulkCovers" type="button" title="Pick several photos named by Find #, e.g. 029-asap-rocky.jpg">Bulk upload covers</button>
      <button class="btn primary" id="newPost" type="button">+ New post</button>
    </div>
    <div class="status" id="status"></div>
    <p class="hint" id="tabHint"></p>
    <div class="bulk" id="bulk"></div>
    <div class="list" id="list"></div>
  </section>

  <section id="editView" hidden></section>
  <section id="cfgView" hidden></section>
  <section id="prodView" hidden></section>
</div>

<dialog id="settings">
  <form method="dialog" id="settingsForm" style="display:flex;flex-direction:column;gap:10px">
    <h2 style="margin:0;font:800 26px/1 var(--display);text-transform:uppercase">Connect GitHub</h2>
    <div class="two">
      <label class="f" for="sOwner">GitHub username<input id="sOwner" autocomplete="off"></label>
      <label class="f" for="sRepo">Repo<input id="sRepo" placeholder="copthefit"></label>
    </div>
    <label class="f" for="sToken">Token<input id="sToken" type="password" autocomplete="off" placeholder="github_pat_…"></label>
    <p class="hint">Fine-grained token for only the copthefit repo with <b>Contents: Read and write</b>. Add <b>Actions: Read and write</b> to use Post now. It stays in this browser only.</p>
    <div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" value="cancel" type="submit">Cancel</button><button class="btn primary" id="sSave" value="save" type="submit">Save</button></div>
  </form>
</dialog>
<input type="file" id="filePick" accept="image/*" hidden>
<input type="file" id="bulkPick" accept="image/*" multiple hidden>

<script>
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

/* ---------- settings ---------- */
function settings() {
  let s = {};
  try { s = JSON.parse(localStorage.getItem("ctf-admin") || "{}"); } catch (e) {}
  const host = location.hostname.endsWith(".github.io") ? location.hostname.split(".")[0] : "";
  const repo = location.hostname.endsWith(".github.io") ? (location.pathname.split("/")[1] || "copthefit") : "copthefit";
  return { owner: s.owner || host, repo: s.repo || repo, branch: s.branch || "main", token: s.token || "" };
}
function saveSettings(s) { try { localStorage.setItem("ctf-admin", JSON.stringify(s)); } catch (e) { flash("This browser blocked saving settings.", "err"); } }

/* ---------- GitHub ---------- */
const GH = {
  async req(path, opts = {}) {
    const s = settings();
    if (!s.owner || !s.token) throw new Error("Connect GitHub in Settings first.");
    const r = await fetch(`https://api.github.com/repos/${s.owner}/${s.repo}${path}`, {
      ...opts, cache: "no-store",
      headers: { Accept: "application/vnd.github+json", Authorization: `Bearer ${s.token}`, "X-GitHub-Api-Version": "2022-11-28", ...(opts.body ? { "Content-Type": "application/json" } : {}) }
    });
    if (!r.ok) {
      const t = await r.text();
      const e = new Error(`GitHub ${r.status}${r.status === 401 ? " (token wrong or expired)" : r.status === 404 ? " (check username, repo and token access)" : ""}: ${t.slice(0, 140)}`);
      e.status = r.status; throw e;
    }
    return r.status === 204 ? null : r.json();
  },
  dec(b64) { const bin = atob(b64.replace(/\n/g, "")); return new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0))); },
  b64bytes(bytes) { let s = ""; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(s); },
  b64text(t) { return GH.b64bytes(new TextEncoder().encode(t)); },
  async json(path, ref) {
    const f = await GH.req(`/contents/${path}?ref=${encodeURIComponent(ref || settings().branch)}`);
    return JSON.parse(GH.dec(f.content || (await GH.req(`/git/blobs/${f.sha}`)).content));
  },
  // Read the latest data, apply change(doc), and commit it together with any image files, in one commit.
  async jsonOr(path, ref, fallback) { try { return await GH.json(path, ref); } catch (e) { if (e.status === 404) return fallback; throw e; } },
  async commit(change, files, message, more = []) {
    const s = settings();
    for (let attempt = 0; attempt < 3; attempt++) {
      const ref = await GH.req(`/git/ref/heads/${encodeURIComponent(s.branch)}`);
      const head = ref.object.sha;
      const doc = await GH.json("data/fits.json", head);
      const result = change(doc);
      const extra = [];
      for (const m of more) { const j = await GH.jsonOr(m.path, head, m.empty); m.change(j); extra.push({ path: m.path, base64: GH.b64text(JSON.stringify(j, null, 1) + "\n"), json: j }); }
      const commit = await GH.req(`/git/commits/${head}`);
      const tree = [];
      for (const f of [{ path: "data/fits.json", base64: GH.b64text(JSON.stringify(doc, null, 1) + "\n") }, ...files, ...extra]) {
        const blob = await GH.req(`/git/blobs`, { method: "POST", body: JSON.stringify({ content: f.base64, encoding: "base64" }) });
        tree.push({ path: f.path, mode: "100644", type: "blob", sha: blob.sha });
      }
      const t = await GH.req(`/git/trees`, { method: "POST", body: JSON.stringify({ base_tree: commit.tree.sha, tree }) });
      const c = await GH.req(`/git/commits`, { method: "POST", body: JSON.stringify({ message, tree: t.sha, parents: [head] }) });
      try {
        await GH.req(`/git/refs/heads/${encodeURIComponent(s.branch)}`, { method: "PATCH", body: JSON.stringify({ sha: c.sha }) });
        DOC = doc;
        for (const m of more) if (m.done) m.done(extra.find(x => x.path === m.path).json);
        return result;
      } catch (e) { if (e.status !== 422 || attempt === 2) throw e; } // someone else saved first: redo on top
    }
  },
  raw(path) { const s = settings(); return `https://raw.githubusercontent.com/${s.owner}/${s.repo}/${s.branch}/${path}?t=${STAMP}`; }
};
let STAMP = Date.now();

/* ---------- state ---------- */
let PRODUCTS = { products: [] };
let STATUS = {}; // data/status.json: what the Instagram poster saw on its last run
let DIRTY = false; // unsaved edits in the open post
function confirmLeave() {
  if (!DIRTY && !(PENDING && (PENDING.photo || PENDING.items.size))) return true;
  const now = Date.now();

// Toast at the top-right. Errors stay until closed; others fade after a few seconds. action: {label, run} adds a button (e.g. Undo).
function flash(text, kind = "", action) {
  clearTimeout(flash.t);
  if (!text) { $("#flash").innerHTML = ""; return; }
  $("#flash").innerHTML = `<div class="msg ${kind}" role="${kind === "err" ? "alert" : "status"}"><span>${text}</span><span style="display:flex;gap:6px;align-items:center">${action ? `<button class="undo" type="button">${esc(action.label)}</button>` : ""}<button class="x" type="button" aria-label="Dismiss">×</button></span></div>`;
  $("#flash .x").onclick = () => flash("");
  if (action) $("#flash .undo").onclick = () => { flash(""); action.run(); };
  if (kind !== "err" && !/…$/.test(text)) flash.t = setTimeout(() => flash(""), action ? 10000 : 6000);
}

}

/* ---------- bulk actions on selected posts (one commit, one site rebuild) ---------- */
const BULK = {
  publish: { label: "Publish to site", apply: f => { if (f.status === "review" || f.status === "rejected") { f.status = "approved"; return true; } } },
  queue: { label: "Add to Instagram queue", apply: f => { if (f.status === "posted" || f.ig_queue) return; if (f.status !== "approved") f.status = "approved"; f.ig_queue = true; return true; } },
  unqueue: { label: "Remove from Instagram queue", apply: f => { if (!f.ig_queue) return; f.ig_queue = false; f.priority = 1; return true; } },
  unpublish: { label: "Unpublish", danger: true, apply: f => { if (f.status === "rejected") return; f.status = "rejected"; f.ig_queue = false; return true; } }
};
function renderBulk() {
  const shown = SHOWN.filter(n => SEL.has(n)).length;
  const all = SHOWN.length && shown === SHOWN.length;
  $("#bulk").innerHTML = !SHOWN.length ? "" : `<label><input type="checkbox" id="selAll"${all ? " checked" : ""}> Select all${SHOWN.length ? ` (${SHOWN.length})` : ""}</label>
    ${SEL.size ? `<span class="n">${SEL.size} selected</span>
      ${Object.entries(BULK).map(([k, a]) => { const n = [...SEL].filter(x => { const f = DOC.fits.find(y => y.find === x); return f && a.apply(JSON.parse(JSON.stringify(f))); }).length;
        return n ? `<button class="btn sm${a.danger ? " danger" : k === "publish" ? " primary" : ""}" type="button" data-bulk="${k}">${a.label}${n < SEL.size ? ` (${n})` : ""}</button>` : ""; }).join("")}
      <button class="btn sm" type="button" id="selClear">Clear</button>` : ""}`;
  const sa = $("#selAll");
  if (sa) { sa.indeterminate = shown > 0 && !all; sa.onchange = () => { SHOWN.forEach(n => sa.checked ? SEL.add(n) : SEL.delete(n)); renderList(); }; }
  if ($("#selClear")) $("#selClear").onclick = () => { SEL.clear(); renderList(); };
  $("#bulk").querySelectorAll("[data-bulk]").forEach(b => b.onclick = () => bulkAction(b.dataset.bulk));
}
async function bulkAction(kind) {
  const a = BULK[kind], finds = [...SEL];
  if (kind === "unpublish" && !confirmUnpublish(finds.length)) return;
  $("#bulk").querySelectorAll("button").forEach(b => b.disabled = true);
  try {
    flash(`${a.label}: ${finds.length} post${finds.length > 1 ? "s" : ""}…`);
    const changed = await GH.commit(doc => {
      const out = [];
      for (const n of finds) {
        const f = doc.fits.find(x => x.find === n);
        if (f && a.apply(f)) { f.updated = new Date().toISOString(); out.push(n); }
      }
      return out;
    }, [], `${a.label}: ${finds.map(n => "#" + n).join(", ")}`);
    SEL.clear();
    const skipped = finds.length - changed.length;
    flash(`${a.label}: ${changed.length} post${changed.length === 1 ? "" : "s"} updated${skipped ? `, ${skipped} already done or not allowed (e.g. already on Instagram)` : ""}. The site updates in about 3 minutes.`, "ok");
    renderList();
  } catch (e) { flash(esc(e.message), "err"); renderBulk(); }
}
function confirmUnpublish(n) {
  // inline confirm without a browser dialog: second click within 5s confirms
  const now = Date.now();
  if (confirmUnpublish.at && now - confirmUnpublish.at < 5000) { confirmUnpublish.at = 0; return true; }
  confirmUnpublish.at = now;
  flash(`Unpublish ${n} post${n > 1 ? "s" : ""}? They'll come off the site and the Instagram queue. Click Unpublish again to confirm.`, "err");
  return false;
}

});

/* ---------- bulk covers ---------- */
// Files are matched to posts by the Find # at the start of the name: 029-asap-rocky.jpg -> #029.
async function bulkCovers(files) {
  const picked = [], skipped = [];
  for (const file of files) {
    const m = file.name.match(/^#?(\d{1,3})(?!\d)/);
    const find = m && m[1].padStart(3, "0");
    if (find && DOC.fits.some(f => f.find === find)) picked.push({ find, file }); else skipped.push(file.name);
  }
  if (!picked.length) { flash(`No files matched a post. Start each file name with its Find #, like 029-asap-rocky.jpg.`, "err"); return; }
  try {
    flash(`Uploading ${picked.length} cover${picked.length > 1 ? "s" : ""}…`);
    const imgs = [];
    for (const p of picked) imgs.push({ ...p, b64: (await toB64(p.file, "image/jpeg")).b64 });
    const pend = [];
    const done = await GH.commit(doc => {
      pend.length = 0;
      const names = [];
      for (const p of imgs) {
        const f = doc.fits.find(x => x.find === p.find);
        const src = (f.sources || [])[0] || {};
        const outlet = (src.label || "").split(" — ")[0];
        const old = f.photo || {};
        f.photo = { credit: old.credit || (outlet ? `via ${outlet}` : "source"), source_url: old.source_url || src.url || "" };
        if (old.license) f.photo.license = old.license;
        f.updated = new Date().toISOString();
        pend.push({ path: `images/inbox/${p.find}-photo.jpg`, base64: p.b64 });
        pend.push({ path: `images/inbox/${p.find}-photo.json`, base64: GH.b64text(JSON.stringify({ credit: f.photo.credit, source_url: f.photo.source_url, license: f.photo.license || "", pins: {} }) + "\n") });
        names.push(`#${p.find} ${f.celeb}`);
      }
      return names;
    }, pend, `Covers: ${imgs.map(p => "#" + p.find).join(", ")}`);
    STAMP = Date.now();
    flash(`Added covers for ${done.map(esc).join(", ")}. They show up here in about 3–5 minutes, once the build finishes (refresh then). Credits were filled from each post's source; open a post to check it and pin the items.${skipped.length ? ` Skipped (no matching Find #): ${skipped.map(esc).join(", ")}.` : ""}`, "ok");
    renderList();
  } catch (e) { flash(esc(e.message), "err"); }
}

// Which existing item a saved product most likely is: same brand and shared name words, preferring items without a link.
function matchItem(f, p) {
  const words = t => new Set((t || "").toLowerCase().replace(/[^a-z0-9 ]/g, " ").split(/\s+/).filter(w => w.length > 2 && !["the", "and", "men", "mens", "watch", "with"].includes(w)));
  const pw = words(p.name), pb = (p.brand || "").toLowerCase();
  let best = -1, score = 0;
  f.items.forEach((it, k) => {
    const iw = words(it.name); let sc = [...iw].filter(w => pw.has(w)).length;
    if (pb && (it.brand || "").toLowerCase() === pb) sc += 2;
    if (!it.product_url) sc += 0.5;
    if (sc > score && sc >= 3) { score = sc; best = k; }
  });
  return best;
}
const stripBrand = (name, brand) => brand && name.toLowerCase().startsWith(brand.toLowerCase() + " ") ? name.slice(brand.length + 1).trim() : name;
const cardBusy = (i, label, btn) => { const c = $("#prodView").querySelector(`.prod[data-i="${i}"]`); if (c) c.classList.add("busy"); const b = c && c.querySelector(btn); if (b) b.textContent = label; };

        if (!it.brand && v.brand) it.brand = v.brand;

      if (v.type) item.type = v.type;

    [{ path: "data/products.json", empty: { products: [] }, change: j => { j.products = j.products.filter(x => x.id !== p.id); }, done: j => { PRODUCTS = j; } }]);

    const g = $("#goEdit"); if (g) g.onclick = e => { e.preventDefault(); openEditor(v.find); };
  } catch (e) { flash(esc(e.message), "err"); renderProducts(); }

/* ---------- affiliates & site settings (config.json) ---------- */
// Same rules the site uses when it builds a Shop link: store deep link > Amazon tag / eBay campaign > Skimlinks > Sovrn.
function affLink(raw, cfg = CFG) {
  let u;
  try { u = new URL(raw); } catch (e) { return { url: raw, via: "" }; }
  const a = (cfg && cfg.affiliate) || {}, host = u.hostname;
  for (const st of a.stores || []) {
    const d = (st.domain || "").toLowerCase().replace(/^\./, "").replace(/^www\./, "");
    if (d && (st.template || "").includes("{url}") && (host === d || host.endsWith("." + d))) return { url: st.template.replace("{url}", encodeURIComponent(u.toString())), via: `${d} deep link` };
  }
  if (host.endsWith("amazon.com")) { if (!a.amazon_tag) return { url: u.toString(), via: "" }; u.searchParams.set("tag", a.amazon_tag); return { url: u.toString(), via: `Amazon tag ${a.amazon_tag}` }; }
  if (host.endsWith("ebay.com")) {
    if (!a.ebay_campaign_id) return { url: u.toString(), via: "" };
    for (const [k, v] of Object.entries({ mkcid: "1", mkrid: "711-53200-19255-0", siteid: "0", campid: a.ebay_campaign_id, toolid: "10001", mkevt: "1" })) u.searchParams.set(k, v);
    return { url: u.toString(), via: "eBay Partner Network" };
  }
  if (a.skimlinks_id) return { url: "https://go.skimresources.com/?id=" + encodeURIComponent(a.skimlinks_id) + "&xs=1&url=" + encodeURIComponent(u.toString()), via: "Skimlinks" };
  if (a.sovrn_key) return { url: "https://redirect.viglink.com?key=" + encodeURIComponent(a.sovrn_key) + "&u=" + encodeURIComponent(u.toString()), via: "Sovrn" };
  return { url: u.toString(), via: "" };
}
// What an item's Link box turns into (product page, "retailer: search words", or custom).
const hasAffIds = () => { const a = (CFG && CFG.affiliate) || {}; return !!(a.amazon_tag || a.ebay_campaign_id || a.skimlinks_id || a.sovrn_key || (a.stores || []).length); };
function itemAff(text) {
  if (!hasAffIds()) return "";
  const t = (text || "").trim();
  if (!t || /^custom$/i.test(t)) return "";
  let raw = t;
  const m = t.match(/^([a-z0-9]+):\s*(.+)$/i);
  if (m && !/^https?$/i.test(m[1]) && CFG && CFG.retailers[m[1].toLowerCase()]) raw = CFG.retailers[m[1].toLowerCase()].search + encodeURIComponent(m[2]).replace(/%20/g, "+");
  const r = affLink(raw);
  return r.via ? `<span class="aff on">✓ Affiliate link via ${esc(r.via)}</span>` : `<span class="aff">Won't earn yet: no affiliate ID for this store</span>`;
}

async function toB64(blob, type) {
  const bmp = await createImageBitmap(blob);
  const scale = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas");
  c.width = Math.round(bmp.width * scale); c.height = Math.round(bmp.height * scale);
  const ctx = c.getContext("2d");
  if (type === "image/jpeg") { ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height); }
  ctx.drawImage(bmp, 0, 0, c.width, c.height);
  const out = await new Promise(r => c.toBlob(r, type, 0.9));
  return { b64: GH.b64bytes(new Uint8Array(await out.arrayBuffer())), url: URL.createObjectURL(out) };
}

async function setPhoto(blob, meta = {}) {
  readForm();
  try {
    PENDING.photo = { ...(await toB64(blob, "image/jpeg")), ...meta };
    DRAFT.items.forEach(it => delete it.pin);
    if (meta.credit) DRAFT.photo = { ...(DRAFT.photo || {}), credit: meta.credit, license: meta.license, source_url: meta.source_url };
    else if (!DRAFT.photo) DRAFT.photo = { credit: "" };
    renderEditor();
  } catch (e) { msg(`Couldn't read that image: ${esc(e.message)}`, "err"); }
}

async function useCandidate(c) {
  try {

    if (!r.ok) throw new Error(r.status);
    await setPhoto(await r.blob(), { credit: `${c.author} / ${c.license} via Wikimedia Commons`, license: c.license, source_url: c.page });
  } catch (e) { msg(`Couldn't load that photo. <a href="${esc(c.page)}" target="_blank">Open it</a>, save it, then use Upload photo.`, "err"); }

/* ---------- save ---------- */
function msg(text, kind = "") { $("#edMsg").innerHTML = text ? `<div class="msg ${kind}">${text}</div>` : ""; }

function parseItems() {
  return DRAFT.items.map((it, i) => {
    const n = i + 1;
    const link = (it._link || "").trim();
    if (!(it.name || "").trim()) throw new Error(`Item ${n}: add the item name.`);
    if (/\b(dupe|fake|faux|replica)\b/i.test(it.name)) throw new Error(`Item ${n}: avoid dupe/fake/faux/replica wording.`);
    const out = { ...it, slide: i + 2, brand: (it.brand || "").trim(), name: it.name.trim(), product_url: "", retailer: "", query: "" };
    delete out._link;
    if (!out.type) delete out.type; // blank = detected automatically when the site builds
    const m = link.match(/^([a-z0-9]+)\s*:\s*(.+)$/i);
    if (/^https?:\/\//i.test(link)) out.product_url = link;
    else if (m && !/^https?$/i.test(m[1])) {
      const key = m[1].toLowerCase();
      if (CFG && !CFG.retailers[key]) throw new Error(`Item ${n}: unknown retailer "${m[1]}". Use: ${Object.keys(CFG.retailers).join(", ")}`);
      out.retailer = key; out.query = m[2].trim();
    } else if (!link || /^custom$/i.test(link)) {
      out.note = out.note && !/custom piece/i.test(out.note) ? out.note : "Custom piece — not for sale";
    } else throw new Error(`Item ${n}: the link should be a web address, "retailer: search words", or custom.`);
    if (out.product_url || out.retailer) out.note = /custom piece/i.test(out.note || "") ? "" : (out.note || "");
    return out;
  });
}

// The build and the Instagram poster change posts in the background (cut-out images, cover processing,
// "posted" status). Saving an editor that was opened before those changes must not undo them.
const BOT_ITEM_KEYS = ["img", "id", "image_fetch", "image_src", "image_replace", "image_replace_failed"];
function keepBackgroundChanges(latest, fresh, action) {
  for (const k of ["posted_at", "ig_media_id", "ig_permalink"]) if (latest[k]) fresh[k] = latest[k];
  if (latest.status === "posted" && !["unpublish", "restore"].includes(action)) { fresh.status = "posted"; fresh.ig_queue = false; }
  if (latest.photo) fresh.photo = { ...latest.photo, ...(fresh.photo || {}) };   // a cover added elsewhere stays; your credit edit wins
  else if (!fresh.photo || !Object.keys(fresh.photo).length) delete fresh.photo;
  const key = it => (it.brand || "") + "|" + (it.name || "");
  fresh.items.forEach(it => {
    const o = latest.items.find(x => it.id && x.id === it.id) || latest.items.find(x => !x.id && key(x) === key(it)) || latest.items.find(x => key(x) === key(it));
    if (!o) return;
    for (const k of BOT_ITEM_KEYS) { if (o[k] !== undefined) it[k] = o[k]; else delete it[k]; }
  });
}

async function save(action) {
  readForm();
  const d = DRAFT;
  const busy = on => $("#editView").querySelectorAll(".actions button").forEach(b => b.disabled = on);
  try {
    for (const [k, name] of [["celeb", "Who"], ["context", "Where"], ["date", "When"], ["headline", "Headline"], ["detail", "What they wore"]])
      if (!d[k]) throw new Error(`${name} is empty.`);
    if (!(d.sources[0].url || "").match(/^https?:\/\//)) throw new Error("Add the source link (https://…).");
    if (!d.sources[0].label) d.sources[0].label = new URL(d.sources[0].url).hostname.replace("www.", "");
    if ((PENDING.photo || d.photo) && !(d.photo && d.photo.credit)) throw new Error("Add the photo credit.");
    if (action === "now" && !(PENDING.photo || d.photo)) throw new Error("Add a cover photo before posting.");
    const items = parseItems();
    busy(true); msg("Saving…");

    const pend = [];
    const pinMeta = {};
    items.forEach(it => { if (it.pin) pinMeta[String(it.slide)] = it.pin; });
    const status = { save: d.status, publish: "approved", queue: "approved", unqueue: d.status, next: "approved", now: "approved", unpublish: "rejected", restore: "approved" }[action];
    // Instagram queue is only changed by the Instagram buttons, never by Save or Publish.
    const igQueue = ["queue", "next", "now"].includes(action) ? true : ["unqueue", "unpublish", "restore"].includes(action) ? false : !!d.ig_queue;
    const find = await GH.commit(doc => {
      let f = d.find ? doc.fits.find(x => x.find === d.find) : null;
      const n = f ? f.find : String(Math.max(0, ...doc.fits.map(x => +x.find)) + 1).padStart(3, "0");
      const fresh = {
        ...(f || {}), ...d, find: n, items, status, updated: new Date().toISOString(),
        ig_queue: igQueue,
        priority: action === "next" || action === "now" ? 0 : action === "unqueue" ? 1 : (f ? f.priority ?? 1 : 1),
        added: (f && f.added) || new Date().toISOString().slice(0, 10)
      };
      if (f) keepBackgroundChanges(f, fresh, action);
      else if (!d.photo) delete fresh.photo;
      if (f) Object.keys(f).forEach(k => delete f[k]); else { f = {}; doc.fits.push(f); }
      Object.assign(f, fresh);
      // image files for this commit
      pend.length = 0;
      if (PENDING.photo) {
        pend.push({ path: `images/inbox/${n}-photo.jpg`, base64: PENDING.photo.b64 });
        pend.push({ path: `images/inbox/${n}-photo.json`, base64: GH.b64text(JSON.stringify({ credit: f.photo.credit, source_url: f.photo.source_url || "", license: f.photo.license || "", pins: pinMeta }) + "\n") });
      }
      items.forEach((it, i) => { const p = PENDING.items.get(d.items[i]); if (p) pend.push({ path: `images/inbox/${n}-${it.slide}.png`, base64: p.b64 }); });
      return n;
    }, pend, `${{ save: "Edit", publish: "Publish", queue: "IG queue +", unqueue: "IG queue −", next: "Post next", now: "Post now", unpublish: "Unpublish", restore: "Restore" }[action]} #${d.find || "new"}: ${d.celeb}`);
    // GH.commit builds files inside change(); pass them by reference
    STAMP = Date.now();
    DIRTY = false; PENDING = { photo: null, items: new Map() }; // saved: nothing pending any more

    let note = "Saved. The site and slides update in about 3 minutes.";
    if (action === "save") note = d.status === "review" ? "Saved. Still a lead: press Publish to site to put it live." : d.status === "rejected" ? "Saved. Still unpublished." : "Saved and live: the site shows the change in about 3 minutes. Instagram schedule unchanged.";
    if (action === "publish") note = "Published to the site. It's live in about 3 minutes. Not added to Instagram.";
    if (action === "queue") note = "Added to the Instagram queue (and live on the site).";
    if (action === "unqueue") note = "Removed from the Instagram queue. Still on the site.";
    if (action === "next") note = "Saved. This is the next Instagram post.";
    if (action === "unpublish") note = "Unpublished. It's off the site and out of the Instagram queue.";
    if (action === "restore") note = "Restored. It's back on the site in about 3 minutes (not in the Instagram queue).";
    if (action === "now") {
      try {
        await GH.req(`/actions/workflows/post.yml/dispatches`, { method: "POST", body: JSON.stringify({ ref: settings().branch, inputs: { dry_run: "false", find } }) });
        note = "Posting now: it goes live on Instagram as soon as the new slides are built (about 5 minutes).";
      } catch (e) {
        note = e.status === 403 || e.status === 404
          ? "Saved and moved to the front of the Instagram queue. To post instantly, give the token Actions: Read and write. Otherwise it posts at the next daily slot."
          : `Saved and moved to the front of the Instagram queue, but starting the post failed: ${esc(e.message)}`;
      }
    }
    flash(note, "ok");
    closeEditor();
    const saved = DOC.fits.find(x => x.find === find);
    if (saved && !STAGES.find(x => x.id === TAB).test(saved)) { TAB = "all"; renderList(); }
  } catch (e) {
    msg(esc(e.message), "err");
  } finally {
    busy(false);
  }
}

/* ---------- boot ---------- */
async function load() {
  flash("Loading…");
  [DOC, CFG, PRODUCTS, STATUS] = await Promise.all([GH.json("data/fits.json"), GH.json("config.json"), GH.jsonOr("data/products.json", undefined, { products: [] }), GH.jsonOr("data/status.json", undefined, {})]);
  renderProdCount();
  flash("");
  const m = location.hash.match(/^#edit-(\d{3})$/); // a bookmarked or refreshed post opens directly
  if (location.hash === "#settings") { history.replaceState(null, "", location.pathname); openCfg(); }
  else if (location.hash === "#products") { history.replaceState(null, "", location.pathname); openProducts(); }
  else if (m && DOC.fits.some(f => f.find === m[1])) { history.replaceState(null, "", location.pathname); openEditor(m[1]); } // list entry underneath, so Back lands on the list
  else {
    const t = location.hash.match(/^#tab-(\w+)$/);
    if (t && STAGES.some(x => x.id === t[1])) TAB = t[1]; else if (location.hash) history.replaceState(null, "", location.pathname);
    renderList();
  }
}
