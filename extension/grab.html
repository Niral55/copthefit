<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cop the Fit</title>
<link rel="stylesheet" href="ui.css">
</head>
<body>
<div class="grab">
  <header><div class="mark">Cop the <span>Fit</span></div><div class="sub" id="modeLabel"></div></header>
  <main>
    <div class="imgbox" id="productBox"><img id="img" alt="The image you right-clicked"></div>
    <div class="pinbox" id="photoBox" hidden><div class="pinwrap" id="pinwrap"><img id="photo" alt="Cover photo. Click to pin items."></div></div>
    <label for="find">Find #
      <input id="find" list="finds" placeholder="Type a number or name, e.g. 003" autocomplete="off">
      <datalist id="finds"></datalist>
    </label>

    <div id="productFields">
      <div id="items" class="pick"></div>
      <label class="check" for="useLink"><input id="useLink" type="checkbox" checked> Use this page as the item's shop link</label>
      <p class="hint" id="pageUrl"></p>
    </div>

    <div id="photoFields" hidden>
      <label for="credit">Photo credit<input id="credit" placeholder="@account that posted it, or photographer / agency"></label>
      <div id="pinHelp" class="hint"></div>
      <ol class="pins" id="pinList"></ol>
      <div class="row"><button class="btn" id="undo" type="button">Undo pin</button><button class="btn" id="clear" type="button">Clear pins</button></div>
    </div>

    <div class="row"><button class="btn primary" id="save" type="button" disabled>Save to Cop the Fit</button><button class="btn" id="close" type="button">Close</button></div>
    <div id="msg"></div>
  </main>
</div>
<script src="gh.js"></script>
<script src="grab.js"></script>
</body>
</html>
