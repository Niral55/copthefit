name: Daily Instagram post

# Posts the next approved carousel once a day. 16:05 UTC = 12:05 PM New York (EDT), 11:05 AM (EST).
on:
  schedule:
    - cron: "5 16 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only, don't post"
        type: boolean
        default: true
      find:
        description: "Post this Find # now (blank = next in queue)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: instagram-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Refresh Instagram token
        continue-on-error: true
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python scripts/refresh_token.py

      - name: Post next carousel
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
          FIND: ${{ inputs.find }}
        run: python scripts/post_instagram.py

      - name: Record the post (and the run's status for the admin page)
        if: always()
        run: |
          if [ -n "$(git status --porcelain data)" ]; then
            git config user.name "copthefit-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/fits.json data/status.json
            git commit -m "Instagram run: $(python -c 'import json;print(json.load(open("data/status.json"))["instagram"]["result"])' 2>/dev/null || echo update)"
            for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
          fi
