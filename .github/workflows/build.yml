name: Build and deploy

# Runs on every change: cuts out new product images, renders carousels, rebuilds the site, deploys to GitHub Pages.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Cache background-removal model
        uses: actions/cache@v4
        with:
          path: |
            ~/.u2net
            ~/.rembg
          key: rembg-isnet-general-use-v1

      - name: Check data
        run: python scripts/check.py

      - name: Product images (inbox + product links)
        run: python scripts/process_images.py

      - name: Save new images back to the repo
        run: |
          if [ -n "$(git status --porcelain images data)" ]; then
            git config user.name "copthefit-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A images data
            git commit -m "Process product images [skip ci]"
            git pull --rebase
            git push
          fi

      - run: python -m playwright install --with-deps chromium

      - name: Render carousels
        run: python scripts/render_slides.py

      - name: Build site
        run: python scripts/build_site.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
