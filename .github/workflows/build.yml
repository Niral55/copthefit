name: Build and deploy

# Runs on every change: cuts out new product images, renders carousels, rebuilds the site, deploys to GitHub Pages.
on:
  push:
    branches: [main]
    paths-ignore: [data/products.json, data/status.json, extension/**, LEADS.md, README.md]  # these don't change the site
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Cache background-removal model
        uses: actions/cache@v4
        with:
          path: |
            ~/.u2net
            ~/.rembg
          key: rembg-isnet-general-use-v1

      - name: Check data
        run: python scripts/check.py

      - name: Free-to-use cover photos (Wikimedia Commons)
        run: python scripts/find_free_photos.py
        continue-on-error: true

      - name: Product images (inbox + product links)
        run: python scripts/process_images.py

      - name: Save new images back to the repo
        # If someone saved (or another build saved images) meanwhile, start over from the newest version
        # and process again, instead of failing and leaving the site un-updated.
        run: |
          git config user.name "copthefit-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4; do
            [ -z "$(git status --porcelain images data)" ] && break
            git add -A images data
            git commit -qm "Process product images [skip ci]"
            if git pull --rebase -q && git push -q; then break; fi
            echo "Main moved on; redoing image processing on the newest version (attempt $attempt)"
            git rebase --abort 2>/dev/null || true
            git fetch -q origin main
            git reset -q --hard origin/main
            python scripts/process_images.py
            sleep $((attempt * 5))
          done
          git status --porcelain images data | grep -q . && { echo "Could not save images after 4 tries"; exit 1; } || true

      - run: python -m playwright install --with-deps chromium

      - name: Render carousels
        run: python scripts/render_slides.py

      - name: Build site
        run: python scripts/build_site.py

      - name: Publish the site (gh-pages branch)
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          git init -q -b gh-pages
          git config user.name "copthefit-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Site build ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
