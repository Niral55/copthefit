name: Enrich saved products

# Runs when the Chrome extension saves a product: AI cleans the name, fills the brand and suggests a post.
on:
  push:
    branches: [main]
    paths: [data/products.json]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: enrich
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Clean up new products
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/enrich_products.py
      - name: Save
        run: |
          if [ -n "$(git status --porcelain data/products.json)" ]; then
            git config user.name "copthefit-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/products.json
            git commit -m "Enrich saved products [skip ci]"
            for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
          fi
